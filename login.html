<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tiệm Bông Thọ Nhà Trồng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="index.html">🌼 Mini Shop Flower</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-success text-white text-center">
                        <h4 class="mb-0">Đăng Nhập Tài Khoản</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email:</label>
                                <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn..." required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Mật Khẩu:</label>
                                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Đăng Nhập</button>
                        </form>
                        <hr>
                        <button id="btnGoogleLogin" class="btn btn-outline-primary w-100 fw-bold">Đăng Nhập Với Google</button>
                        <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="signup.html" class="text-success fw-bold">Đăng Ký Ngay</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8z0VzOWLwlpOSPQlNQyHhz8vZ1y7gG0Y",
            authDomain: "hoavantho-tet.firebaseapp.com",
            projectId: "hoavantho-tet",
            storageBucket: "hoavantho-tet.firebasestorage.app",
            messagingSenderId: "446841110492",
            appId: "1:446841110492:web:0b41a649e1bad3f29c9919",
            measurementId: "G-YQ2PLW1F28"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Đăng nhập với email/password
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('Đăng nhập thành công!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('Lỗi đăng nhập: ' + error.message);
            }
        });

        // Đăng nhập với Google
        document.getElementById('btnGoogleLogin').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
                alert('Đăng nhập thành công!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('Lỗi đăng nhập: ' + error.message);
            }
        };
    </script>

</body>

</html>
